name: Build

# Every push (any branch) and PR: build Pitstop.exe, launch it and open every page and theme (smoke test), then run
# the self-test against NVIDIA's real driver lookup and download (signature check, unpack, prepare).
# On main, when <Version> in src/Pitstop/Pitstop.csproj has no release yet, it publishes one:
# bump the version, push, done. Versions with a "-" (0.2.0-beta.1) are published as pre-releases (Beta).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Read version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $xml = [xml](Get-Content src/Pitstop/Pitstop.csproj)
          $v = ($xml.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if (-not $v) { throw "No <Version> in Pitstop.csproj" }
          $tag = "v$v"
          $release = 'false'
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request' -and $env:GITHUB_REF -eq 'refs/heads/main') {
            gh release view $tag --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -ne 0) { $release = 'true' }
            $global:LASTEXITCODE = 0
          }
          $pre = if ($v.Contains('-')) { 'true' } else { 'false' }
          Write-Host "Version $v, tag $tag, release: $release, prerelease: $pre"
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          "prerelease=$pre" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/Pitstop/Pitstop.csproj -c Release -o publish "-p:Version=${{ steps.ver.outputs.version }}" 2>&1 |
            Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ': error |error AVLN|XamlX' |
              Select-Object -First 40 | ForEach-Object { "::error::$($_.Line.Trim())" }
            exit 1
          }
          Get-ChildItem publish | Format-Table Name, Length

      - name: Smoke test (launch Pitstop, open every page and theme)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish\Pitstop.exe -ArgumentList '--smoke-test' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(180000)) { $p.Kill(); "::error::Pitstop did not exit within 180 seconds"; $code = 1 } else { $code = $p.ExitCode }
          $log = Join-Path $env:LOCALAPPDATA 'Pitstop\pitstop.log'
          if (Test-Path $log) { Get-Content $log | Select-Object -Last 60 }
          if ($code -ne 0) {
            "::error::Pitstop failed the smoke test (exit code $code)."
            if (Test-Path $log) { Select-String -Path $log -Pattern 'ERROR' | Select-Object -First 20 | ForEach-Object { "::error::$($_.Line)" } }
            exit 1
          }
          Write-Host "Smoke test passed."

      - name: Self-test (NVIDIA lookup, download, signature, unpack)
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'selftest'
          $p = Start-Process -FilePath publish\Pitstop.exe -ArgumentList '--selftest', "`"$out`"" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(1800000)) { $p.Kill(); "::error::Self-test timed out"; exit 1 }
          if (Test-Path "$out\selftest.log") { Get-Content "$out\selftest.log" } else { "::error::No self-test log" }
          if (Test-Path "$out\pitstop.log") { "--- pitstop.log ---"; Get-Content "$out\pitstop.log" | Select-Object -Last 40 }
          if ($p.ExitCode -ne 0) {
            Select-String -Path "$out\selftest.log" -Pattern '^FAIL' | ForEach-Object { "::error::$($_.Line)" }
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish/Pitstop.exe dist/Pitstop.exe
          $lines = Get-ChildItem dist -Filter *.exe | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-ChildItem dist | Format-Table Name, Length
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v5
        with:
          name: Pitstop
          path: dist/*

      - name: Publish GitHub release
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          $ghArgs = @($tag, 'dist/Pitstop.exe', 'dist/SHA256SUMS.txt', '--target', $env:GITHUB_SHA,
                    '--title', "Pitstop ${{ steps.ver.outputs.version }}", '--notes-file', 'CHANGELOG-latest.md')
          if ('${{ steps.ver.outputs.prerelease }}' -eq 'true') { $ghArgs += '--prerelease' }
          gh release create @ghArgs
